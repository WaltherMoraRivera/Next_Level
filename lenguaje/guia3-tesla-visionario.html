/* ── Header ── */
.g-header{
  background:var(--red); color:white;

}

/* ── Layout ── */
.wrap{max-width:740px;margin:0 auto;padding:28px 18px 80px;}

/* ── Card ── */
.card{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:26px 30px;
  animation:up .3s ease;
}
@keyframes up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.s-label{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:4px;}
.s-title{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:14px;text-wrap:balance;font-family:Georgia,serif;}
.s-body{font-size:15px;color:var(--ink-mid);line-height:1.72;}
.s-hint{font-size:13px;color:var(--ink-muted);font-style:italic;margin-top:8px;}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;gap:7px;

}
.btn-p{background:var(--red);color:white;}
.btn-p:hover{background:var(--red-dk);transform:translateY(-1px);}

}
.reveal.on{display:block;}
.reveal strong{color:var(--red);}

/* ── Reading text ── */
.rtext{

  color:var(--ink); margin:14px 0;
}

}

.vhl{

}

}

.seval-l{font-size:13px;font-weight:700;color:var(--ink-muted);}

.dnd-tip{

.ring-wrap{width:116px;height:116px;margin:0 auto 18px;position:relative;}

.ring-bg{fill:none;stroke:var(--border);stroke-width:10;}

.ring-num span{font-size:11px;font-weight:600;color:var(--ink-muted);}
.rep-msg{text-align:center;font-size:17px;font-weight:700;margin-bottom:18px;color:var(--ink);line-height:1.45;text-wrap:balance;}
.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;}
.rcard{border-radius:var(--radius);padding:13px 15px;border:1.5px solid var(--border);}
.rcard .rc-t{font-size:10.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px;}

.rcard ul li{font-size:13.5px;color:var(--ink-mid);padding:3px 0;display:flex;gap:6px;align-items:baseline;}

.rc-ok{background:var(--green-light);}
.rc-ok .rc-t,.rc-ok li::before{color:var(--green);}
.rc-imp{background:var(--amber-light);}

.rc-nxt{background:var(--red-light);margin-top:11px;}
.rc-nxt .rc-t,.rc-nxt li::before{color:var(--red);}

.rlevel .rl-l{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--ink-muted);}

/* ── Responsive ── */
@media(max-width:580px){

function calcScore(){
  const lit = litA.filter((a,i)=>a===LIT[i].c).length;
  const inf = infA.filter((a,i)=>a===INF[i].c).length;
  const crit = critSelf==='yes'?2:critSelf==='part'?1:0;
  const voc = vocA.filter((a,i)=>a===VOCAB[i].c).length;
  const correctSlots = slots.filter((s,i)=>s===i).length;
  const allDnd = correctSlots===6;
  const partDnd = correctSlots>=4;
  const dnd = allDnd?4:partDnd?2:0;
  const total = lit*2+inf*2+crit+voc+dnd;
  return {lit,inf,crit,voc,dnd,correctSlots,total,max:24};
}

function rQuiz(qs,ans,cur,label,title,ansF,nxtF,doneF){

  return`

  <div class="s-label">${label}</div>
  <div class="s-title">${title}</div>
  <div class="qz-head">
    <span class="qz-ctr">Pregunta ${cur+1} de ${qs.length}</span>
    <div class="qz-bar-wrap"><div class="qz-bar" style="width:${Math.round(cur/qs.length*100)}%"></div></div>
  </div>
  <p class="qz-q">${q.q}</p>
  <div class="qz-opts">
    ${q.opts.map((o,i)=>{
      let cls='';
      if(done){if(i===q.c)cls='ok';else if(i===ans[cur])cls='no';}
      return`<button class="qz-opt ${cls}" ${done?'disabled':''} onclick="${ansF}(${i})">${o}</button>`;
    }).join('')}
  </div>
  <div class="qz-fb ${done?'on':''} ${isOk?'ok-fb':'no-fb'}" id="qfb">
    ${done?(isOk?q.fb_ok:q.fb_no):''}
  </div>
  <div class="btn-row">
    ${done?(cur<qs.length-1
      ?`<button class="btn btn-p" onclick="${nxtF}()">Siguiente pregunta →</button>`
      :`<button class="btn btn-p" onclick="${doneF}()">Continuar →</button>`):''}
  </div>
</div>`;}

  <p class="dbank-lbl">Banco de acontecimientos →</p>
  <div class="dbank" id="dBank">
    ${DND_ORDER.map(evIdx=>{
      const placed=slots.includes(evIdx);
      const isSel=selIdx===evIdx;
      return`
      <div class="ditem ${placed?'placed':''} ${isSel?'sel-item':''}" id="di-${evIdx}"
        draggable="true"
        ondragstart="dStart(event,${evIdx})" ondragend="dEnd(event)"
        onclick="itemClick(${evIdx})">
        ${DND_CORRECT[evIdx]}
      </div>`;
    }).join('')}
  </div>

  ${dndChecked?`
  <div class="qz-fb on ${slots.every((s,i)=>s===i)?'ok-fb':'no-fb'}" style="margin-top:16px;">
    ${slots.every((s,i)=>s===i)
      ?'✅ ¡Perfecto! Ordenaste los 6 acontecimientos correctamente. Excelente comprensión de la cronología de la biografía.'
      :`⚡ Algunos acontecimientos estaban en el orden incorrecto. La línea de tiempo correcta era:<br>
        1→ ${DND_CORRECT[0]}<br>
        2→ ${DND_CORRECT[1]}<br>
        3→ ${DND_CORRECT[2]}<br>
        4→ ${DND_CORRECT[3]}<br>
        5→ ${DND_CORRECT[4]}<br>
        6→ ${DND_CORRECT[5]}`}
  </div>`:''}

  <div class="btn-row" style="margin-top:18px;">
    ${!dndChecked
      ?`<button class="btn btn-p" onclick="checkDnd()" ${slots.includes(null)?'disabled':''}>Verificar orden ✓</button>`
      :`<button class="btn btn-p" onclick="go('challenge')">Continuar →</button>`}
  </div>
</div>`;}

function dStart(e,idx){
  dragIdx=idx; selIdx=null;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>{const el=document.getElementById('di-'+idx);if(el)el.classList.add('dragging');},0);
}
function dEnd(){
  if(dragIdx!==null){const el=document.getElementById('di-'+dragIdx);if(el)el.classList.remove('dragging');}
  dragIdx=null;
  document.querySelectorAll('.dslot').forEach(s=>s.classList.remove('over'));
}
function dOver(e,i){e.preventDefault();document.getElementById('sl-'+i).classList.add('over');}
function dLeave(e,i){document.getElementById('sl-'+i).classList.remove('over');}
function dDrop(e,i){
  e.preventDefault();
  document.getElementById('sl-'+i).classList.remove('over');
  if(dragIdx===null)return;
  const existing=slots[i];
  const prevSlot=slots.indexOf(dragIdx);
  if(prevSlot!==-1)slots[prevSlot]=existing;
  slots[i]=dragIdx;
  dragIdx=null;
  render();
}
function itemClick(evIdx){
  if(dndChecked)return;
  selIdx=selIdx===evIdx?null:evIdx;
  render();
}
function slotClick(i){
  if(dndChecked||selIdx===null)return;
  const existing=slots[i];
  const prev=slots.indexOf(selIdx);
  if(prev!==-1)slots[prev]=existing;
  slots[i]=selIdx;
  selIdx=null;
  render();
}
function rmSlot(e,i){e.stopPropagation();slots[i]=null;render();}
function checkDnd(){dndChecked=true;render();}

function rReport(){
  const s=calcScore();
  const p=Math.round(s.total/s.max*100);
  const C=2*Math.PI*45;
  const off=C-(p/100)*C;

  let emoji,msg,level,nextDiff;
  if(p>=85){
    emoji='🏆';msg='¡Excelente trabajo! Demostraste una comprensión sólida de la biografía, incluyendo la ironía y la argumentación.';
    level='Avanzado';nextDiff='La siguiente guía trabajará textos con varios personajes y comparación entre distintas fuentes.';
  } else if(p>=67){
    emoji='⭐';msg='¡Muy buen desempeño! Comprendes bien los textos biográficos, con algunas áreas que siguen desarrollándose.';
    level='Intermedio alto';nextDiff='Se mantendrá la dificultad actual, incorporando textos con más de un personaje relevante.';
  } else if(p>=50){
    emoji='📈';msg='Buen intento. Tienes bases sólidas, pero hay habilidades que vale la pena seguir practicando.';
    level='Intermedio';nextDiff='La siguiente guía reforzará la identificación de causas históricas y la argumentación con evidencia.';
  } else {
    emoji='💪';msg='Sigue adelante. Cada guía te ayudará a mejorar. ¡Los errores son parte del aprendizaje!';
    level='En desarrollo';nextDiff='La siguiente guía tendrá un texto más corto con preguntas guiadas adicionales.';
  }

  const strengths=[], improve=[];
  if(s.lit>=2)strengths.push('Comprensión literal'); else improve.push('Comprensión literal (buscar datos exactos en el texto)');
  if(s.inf>=2)strengths.push('Comprensión inferencial y reconocimiento de ironía'); else improve.push('Comprensión inferencial y reconocimiento de ironía');
  if(s.voc>=4)strengths.push('Vocabulario en contexto'); else improve.push('Vocabulario (deducir significado por el contexto)');
  if(s.correctSlots>=5)strengths.push('Organización cronológica (línea de tiempo)'); else improve.push('Organización cronológica de acontecimientos');
  if(critSelf==='yes')strengths.push('Argumentación con evidencia textual'); else improve.push('Argumentación y uso de evidencia del texto');

  return`
<div class="card">
  <div class="s-label">📊 Informe Final</div>
  <div class="s-title">Guía 3 · Nikola Tesla, el genio que iluminó el mundo</div>

  <div class="ring-wrap">
    <svg viewBox="0 0 100 100">
      <circle class="ring-bg" cx="50" cy="50" r="45"/>
      <circle class="ring-fill" cx="50" cy="50" r="45"
        stroke-dasharray="${C}" stroke-dashoffset="${C}" id="ringFill"
        data-offset="${off}"/>
    </svg>
    <div class="ring-num">${p}%<span>${s.total}/${s.max} pts</span></div>
  </div>

  <p class="rep-msg">${emoji} ${msg}</p>

  <div class="score-row">
    <span class="score-pill">Literal: ${s.lit}/3 ×2 = ${s.lit*2}pts</span>
    <span class="score-pill">Inferencial: ${s.inf}/3 ×2 = ${s.inf*2}pts</span>
    <span class="score-pill">Vocabulario: ${s.voc}/6 = ${s.voc}pts</span>
    <span class="score-pill">Organización: ${s.dnd}/4 pts (${s.correctSlots}/6 correctas)</span>
    <span class="score-pill">Crítica: ${s.crit}/2 pts</span>
  </div>

  <div class="rlevel"><div class="rl-l">Nivel estimado</div><div class="rl-v">${level}</div></div>

  <div class="rep-grid">
    <div class="rcard rc-ok">
      <div class="rc-t">✅ Habilidades fortalecidas</div>
      <ul>${strengths.length?strengths.map(x=>`<li>${x}</li>`).join(''):'<li>Sigue practicando para desarrollar estas habilidades.</li>'}</ul>
    </div>
    <div class="rcard rc-imp">
      <div class="rc-t">⚡ A seguir trabajando</div>
      <ul>${improve.length?improve.map(x=>`<li>${x}</li>`).join(''):'<li>¡Excelente! No hay áreas críticas que mejorar esta sesión.</li>'}</ul>
    </div>
  </div>

  <div class="rcard rc-nxt">
    <div class="rc-t">🚀 Recomendaciones para la próxima guía</div>
    <ul>
      <li>${nextDiff}</li>
      ${s.voc<4?'<li>Practica leyendo biografías cortas y deduciendo palabras nuevas por el contexto antes de buscarlas.</li>':''}
      ${s.inf<2?'<li>Al leer una biografía, pregúntate si hay algún contraste "irónico" entre lo que el personaje logró y cómo terminó su vida.</li>':''}
      ${s.correctSlots<5?'<li>Para reforzar la cronología, anota mentalmente las fechas y palabras como "luego", "después" y "finalmente" mientras lees.</li>':''}
      <li>Próxima guía: <strong>Texto Periodístico/Argumentativo</strong> → análisis del punto de vista del autor y comparación entre fuentes.</li>
    </ul>
  </div>

  <div style="text-align:center;margin-top:22px;">
    <button class="btn btn-s" onclick="restart()">🔁 Reiniciar guía</button>
  </div>
</div>`;}

function animateRing(){
  requestAnimationFrame(()=>{
    const el=document.getElementById('ringFill');
    if(!el)return;
    const off=parseFloat(el.dataset.offset);
    requestAnimationFrame(()=>{ el.style.strokeDashoffset=off; });
  });
}

function restart(){
  phase='activation';
  litI=0;litA=[];infI=0;infA=[];critSelf=null;
  vocI=0;vocA=[];slots=[null,null,null,null,null,null];
  dndChecked=false;dragIdx=null;selIdx=null;
  render();
}
