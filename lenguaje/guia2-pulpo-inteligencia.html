/* ── Header ── */
.g-header{
  background:var(--red); color:white;
  padding:12px 20px;
  display:flex; align-items:center; gap:14px;
  position:sticky; top:0; z-index:50;

}
.g-badge{

}

/* ── Layout ── */
.wrap{max-width:740px;margin:0 auto;padding:28px 18px 80px;}

/* ── Card ── */
.card{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:26px 30px;
  animation:up .3s ease;
}
@keyframes up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.s-label{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:4px;}
.s-title{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:14px;text-wrap:balance;font-family:Georgia,serif;}
.s-body{font-size:15px;color:var(--ink-mid);line-height:1.72;}
.s-hint{font-size:13px;color:var(--ink-muted);font-style:italic;margin-top:8px;}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:11px 20px;border-radius:8px;
  font-size:14px;font-weight:700;font-family:inherit;

}
.btn-p{background:var(--red);color:white;}
.btn-p:hover{background:var(--red-dk);transform:translateY(-1px);}
.btn-p:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-s{background:var(--red-light);color:var(--red);border:1.5px solid var(--border);}
.btn-s:hover{background:var(--border);}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}

/* ── Reveal ── */

  padding:14px 18px; margin-top:14px;

  font-size:14px; color:var(--ink-mid); line-height:1.65;
}
.reveal.on{display:block;}
.reveal strong{color:var(--red);}

/* ── Reading text ── */
.rtext{
  background:var(--red-xlight);

}
.rtext h3{

}
.rtext p{margin-bottom:11px;}
.rtext p:last-child{margin-bottom:0;}
.vhl{
  color:var(--red);font-weight:700;
  border-bottom:2px dotted var(--red-md);
  cursor:help;
}

.qz-fb.ok-fb{background:var(--green-light);color:var(--green);border:1.5px solid var(--green);}
.qz-fb.no-fb{background:var(--rd-light);color:var(--rd);border:1.5px solid var(--rd);}

}

.vopt.ok{border-color:var(--green);background:var(--green-light);color:var(--green);}
.vopt.no{border-color:var(--rd);background:var(--rd-light);color:var(--rd);}

}

}
.omodel-box strong{color:var(--red);display:block;margin-bottom:5px;font-size:12px;letter-spacing:.5px;}
.seval{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px;}
.seval-l{font-size:13px;font-weight:700;color:var(--ink-muted);}

/* ── Drag & Drop: classification ── */
.dnd-tip{
  background:var(--amber-light);border:1px solid var(--amber);

}
.class-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.class-col{
  border:2px dashed var(--border); border-radius:var(--radius);

}
.class-col.over{border-color:var(--red-md);background:var(--red-light);}
.class-col-head{
  display:flex;align-items:center;gap:8px;

}
.class-col-head .cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

.class-items{display:flex;flex-direction:column;gap:7px;}
.citem-slot{

.dbank{display:flex;flex-direction:column;gap:7px;}
.ditem{
  background:var(--surface);border:2px solid var(--red-md);

.ditem.sel-item{background:var(--red-light);border-color:var(--red);box-shadow:0 0 0 3px rgba(220,38,38,.2);}
.empty-slot{font-size:12.5px;color:var(--border);font-style:italic;padding:6px 0;}

.ring-wrap{width:116px;height:116px;margin:0 auto 18px;position:relative;}

.ring-bg{fill:none;stroke:var(--border);stroke-width:10;}

.ring-num{

  font-size:26px;font-weight:900;color:var(--red);line-height:1;
}
.ring-num span{font-size:11px;font-weight:600;color:var(--ink-muted);}
.rep-msg{text-align:center;font-size:17px;font-weight:700;margin-bottom:18px;color:var(--ink);line-height:1.45;text-wrap:balance;}
.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;}
.rcard{border-radius:var(--radius);padding:13px 15px;border:1.5px solid var(--border);}
.rcard .rc-t{font-size:10.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px;}
.rcard ul{list-style:none;}
.rcard ul li{font-size:13.5px;color:var(--ink-mid);padding:3px 0;display:flex;gap:6px;align-items:baseline;}

.rc-ok .rc-t,.rc-ok li::before{color:var(--green);}
.rc-imp{background:var(--amber-light);}
.rc-imp .rc-t,.rc-imp li::before{color:var(--amber);}
.rc-nxt{background:var(--red-light);margin-top:11px;}
.rc-nxt .rc-t,.rc-nxt li::before{color:var(--red);}
.rlevel{

/* ── Section divider badges ── */
.score-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;}

/* ── Responsive ── */
@media(max-width:580px){
  .card{padding:18px 16px;}
  .rtext{padding:17px 14px;}
  .g-header{padding:10px 14px;}
  .g-pname{display:none;}
  .vword{font-size:19px;}
  .class-cols{grid-template-columns:1fr;}
}

function calcScore(){
  const lit = litA.filter((a,i)=>a===LIT[i].c).length;
  const inf = infA.filter((a,i)=>a===INF[i].c).length;
  const crit = critSelf==='yes'?2:critSelf==='part'?1:0;
  const voc = vocA.filter((a,i)=>a===VOCAB[i].c).length;
  const correctCount = CLASS_ITEMS.filter((it,i)=>placement[i]===it.cat).length;
  const dnd = correctCount>=6?4:correctCount>=4?2:0;
  const total = lit*2+inf*2+crit+voc+dnd;
  return {lit,inf,crit,voc,dnd,correctCount,total,max:24};
}

function rQuiz(qs,ans,cur,label,title,ansF,nxtF,doneF){
  const q=qs[cur];
  const done=ans[cur]!==undefined;
  const isOk=done&&ans[cur]===q.c;
  return`
<div class="card">
  <div class="s-label">${label}</div>
  <div class="s-title">${title}</div>
  <div class="qz-head">
    <span class="qz-ctr">Pregunta ${cur+1} de ${qs.length}</span>
    <div class="qz-bar-wrap"><div class="qz-bar" style="width:${Math.round(cur/qs.length*100)}%"></div></div>
  </div>
  <p class="qz-q">${q.q}</p>
  <div class="qz-opts">
    ${q.opts.map((o,i)=>{
      let cls='';
      if(done){if(i===q.c)cls='ok';else if(i===ans[cur])cls='no';}
      return`<button class="qz-opt ${cls}" ${done?'disabled':''} onclick="${ansF}(${i})">${o}</button>`;
    }).join('')}
  </div>
  <div class="qz-fb ${done?'on':''} ${isOk?'ok-fb':'no-fb'}" id="qfb">
    ${done?(isOk?q.fb_ok:q.fb_no):''}
  </div>
  <div class="btn-row">
    ${done?(cur<qs.length-1
      ?`<button class="btn btn-p" onclick="${nxtF}()">Siguiente pregunta →</button>`
      :`<button class="btn btn-p" onclick="${doneF}()">Continuar →</button>`):''}
  </div>
</div>`;}

      <div class="class-col-head"><div class="cdot"></div>Idea Secundaria</div>
      <div class="class-items">
        ${CLASS_ITEMS.map((it,i)=>placement[i]==='s'?renderPlacedItem(i):'').join('')}
        ${CLASS_ITEMS.filter((it,i)=>placement[i]==='s').length===0?'<div class="empty-slot">Arrastra aquí…</div>':''}
      </div>
    </div>
  </div>

  <p class="dbank-lbl">Banco de ideas →</p>
  <div class="dbank" id="dBank">
    ${CLASS_ORDER.map(i=>{
      const placed=placement[i]!==undefined;
      const isSel=selIdx===i;
      return`
      <div class="ditem ${placed?'placed':''} ${isSel?'sel-item':''}" id="di-${i}"
        draggable="true"
        ondragstart="dStart(event,${i})" ondragend="dEnd(event)"
        onclick="itemClick(${i})">
        ${CLASS_ITEMS[i].t}
      </div>`;
    }).join('')}
  </div>

  ${dndChecked?renderClassFeedback():''}

  <div class="btn-row" style="margin-top:18px;">
    ${!dndChecked
      ?`<button class="btn btn-p" onclick="checkClass()" ${Object.keys(placement).length<6?'disabled':''}>Verificar clasificación ✓</button>`
      :`<button class="btn btn-p" onclick="go('challenge')">Continuar →</button>`}
  </div>
</div>`;
}

function renderPlacedItem(i){
  const it=CLASS_ITEMS[i];
  let cls='';
  let icon='';
  if(dndChecked){
    const ok=placement[i]===it.cat;
    cls=ok?'ok':'no';
    icon=`<span class="cicon">${ok?'✅':'❌'}</span>`;
  } else {
    icon=`<button class="remove-btn" onclick="rmItem(event,${i})" style="margin-left:auto;background:none;border:none;color:var(--ink-muted);cursor:pointer;font-size:15px;">✕</button>`;
  }
  return`<div class="citem-slot ${cls}">${dndChecked?icon:''}<span style="flex:1;">${it.t}</span>${!dndChecked?icon:''}</div>`;
}

function renderClassFeedback(){
  const s=calcScore();
  const allOk=s.correctCount===6;
  let detail='';
  if(!allOk){
    detail = '<br>Revisión:<br>' + CLASS_ITEMS.map((it,i)=>{
      const ok=placement[i]===it.cat;
      return `${ok?'✅':'❌'} "${it.t}" → correcta: ${it.cat==='p'?'Idea Principal':'Idea Secundaria'}`;
    }).join('<br>');
  }
  return`
  <div class="qz-fb on ${allOk?'ok-fb':'no-fb'}" style="margin-top:16px;">
    ${allOk
      ?'✅ ¡Perfecto! Clasificaste las 6 ideas correctamente. Distingues muy bien entre una afirmación central y un dato que la respalda.'
      :`⚡ Clasificaste correctamente ${s.correctCount} de 6. Recuerda: una idea principal expresa una afirmación general del texto; una idea secundaria es un dato específico que la apoya.${detail}`}
  </div>`;
}

function dStart(e,idx){
  dragIdx=idx; selIdx=null;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>{const el=document.getElementById('di-'+idx);if(el)el.classList.add('dragging');},0);
}
function dEnd(){
  if(dragIdx!==null){const el=document.getElementById('di-'+dragIdx);if(el)el.classList.remove('dragging');}
  dragIdx=null;
  document.querySelectorAll('.class-col').forEach(c=>c.classList.remove('over'));
}
function cOver(e,cat){e.preventDefault();document.getElementById('col-'+cat).classList.add('over');}
function cLeave(e,cat){document.getElementById('col-'+cat).classList.remove('over');}
function cDrop(e,cat){
  e.preventDefault();
  document.getElementById('col-'+cat).classList.remove('over');
  if(dragIdx===null)return;
  placement[dragIdx]=cat;
  dragIdx=null;
  render();
}
function itemClick(idx){
  if(dndChecked)return;
  selIdx=selIdx===idx?null:idx;
  render();
}
function colClick(cat){
  if(dndChecked||selIdx===null)return;
  placement[selIdx]=cat;
  selIdx=null;
  render();
}
function rmItem(e,idx){e.stopPropagation();delete placement[idx];render();}
function checkClass(){dndChecked=true;render();}

function rChallenge(){return`
<div class="card">
  <div class="s-label">✨ Desafío de Pensamiento</div>
  <div class="s-title">¡Ahora tú eres el periodista científico!</div>
  <p style="font-size:13.5px;color:var(--ink-muted);margin-bottom:14px;">
    Este ejercicio desarrolla tu capacidad de síntesis: tomar información compleja y comunicarla de forma breve y clara. No hay respuesta incorrecta, pero sí respuestas más elaboradas que otras.
  </p>
  <p class="oq">✍️ Escribe una breve noticia (un titular + 2 o 3 líneas) anunciando el hallazgo de que los pulpos pueden abrir frascos y recordar soluciones. Imagina que la noticia es para estudiantes de tu edad.</p>
  <p class="s-hint" style="margin-bottom:14px;">Recuerda: una buena noticia responde qué pasó, por qué es importante y usa un lenguaje claro y atractivo para el lector.</p>
  <textarea class="otxt" id="chalTxt" placeholder="Escribe aquí tu titular y noticia..." style="min-height:140px;"></textarea>
  <div class="btn-row">
    <button class="btn btn-s" onclick="document.getElementById('chalM').classList.add('on')">👁️ Ver ejemplo</button>
  </div>
  <div class="omodel" id="chalM">
    <div class="omodel-box">
      <strong>📝 EJEMPLO</strong>
      <em>"¡Los pulpos piensan más de lo que creíamos! Científicos descubrieron que estos animales marinos pueden abrir frascos con tapa de rosca y recordar cómo hacerlo días después. El hallazgo sorprende porque el pulpo no tiene huesos ni columna vertebral, pero su cerebro es capaz de aprender y recordar como el de animales mucho más complejos."</em>
      <br><br>
      ¿Notaste cómo ese ejemplo explica el dato, agrega el "por qué sorprende" y usa un tono cercano? Un buen periodista científico simplifica sin perder precisión. ¿Tu versión también lo logró?
    </div>
  </div>
  <div class="btn-row" style="margin-top:18px;">
    <button class="btn btn-p" onclick="go('report')">Ver mi informe final →</button>
  </div>
</div>`;}

// REPORT
// ══════════════════════════════════════════

function rReport(){
  const s=calcScore();
  const p=Math.round(s.total/s.max*100);
  const C=2*Math.PI*45;
  const off=C-(p/100)*C;

  let emoji,msg,level,nextDiff;
  if(p>=85){
    emoji='🏆';msg='¡Excelente trabajo! Demostraste una comprensión sólida del texto informativo en todos los niveles evaluados.';
    level='Avanzado';nextDiff='La siguiente guía aumentará la longitud del texto y trabajará dobles interpretaciones.';
  } else if(p>=67){
    emoji='⭐';msg='¡Muy buen desempeño! Comprendes bien los textos informativos, con algunas áreas que siguen desarrollándose.';
    level='Intermedio alto';nextDiff='Se mantendrá la dificultad actual con variaciones en el vocabulario y el género textual.';
  } else if(p>=50){
    emoji='📈';msg='Buen intento. Tienes bases sólidas, pero hay habilidades que vale la pena seguir practicando.';
    level='Intermedio';nextDiff='La siguiente guía reforzará causa-efecto y la distinción entre ideas principales y secundarias.';
  } else {
    emoji='💪';msg='Sigue adelante. Cada guía te ayudará a mejorar. ¡Los errores son parte del aprendizaje!';
    level='En desarrollo';nextDiff='La siguiente guía tendrá un texto más corto con preguntas guiadas adicionales.';
  }

  const strengths=[], improve=[];
  if(s.lit>=2)strengths.push('Comprensión literal'); else improve.push('Comprensión literal (buscar datos exactos en el texto)');
  if(s.inf>=2)strengths.push('Comprensión inferencial y relaciones causa-efecto'); else improve.push('Comprensión inferencial (deducir información implícita y causas)');
  if(s.voc>=4)strengths.push('Vocabulario en contexto'); else improve.push('Vocabulario (deducir significado por el contexto)');
  if(s.correctCount>=5)strengths.push('Idea principal vs. idea secundaria'); else improve.push('Diferenciar ideas principales de secundarias');
  if(critSelf==='yes')strengths.push('Argumentación con evidencia textual'); else improve.push('Argumentación y uso de evidencia del texto');

  return`
<div class="card">
  <div class="s-label">📊 Informe Final</div>
  <div class="s-title">Guía 2 · El pulpo, el genio de los ocho brazos</div>

  <div class="ring-wrap">
    <svg viewBox="0 0 100 100">
      <circle class="ring-bg" cx="50" cy="50" r="45"/>
      <circle class="ring-fill" cx="50" cy="50" r="45"
        stroke-dasharray="${C}" stroke-dashoffset="${C}" id="ringFill"
        data-offset="${off}"/>
    </svg>
    <div class="ring-num">${p}%<span>${s.total}/${s.max} pts</span></div>
  </div>

  <p class="rep-msg">${emoji} ${msg}</p>

  <div class="score-row">
    <span class="score-pill">Literal: ${s.lit}/3 ×2 = ${s.lit*2}pts</span>
    <span class="score-pill">Inferencial: ${s.inf}/3 ×2 = ${s.inf*2}pts</span>
    <span class="score-pill">Vocabulario: ${s.voc}/6 = ${s.voc}pts</span>
    <span class="score-pill">Organización: ${s.dnd}/4 pts (${s.correctCount}/6 correctas)</span>
    <span class="score-pill">Crítica: ${s.crit}/2 pts</span>
  </div>

  <div class="rlevel"><div class="rl-l">Nivel estimado</div><div class="rl-v">${level}</div></div>

  <div class="rep-grid">
    <div class="rcard rc-ok">
      <div class="rc-t">✅ Habilidades fortalecidas</div>
      <ul>${strengths.length?strengths.map(x=>`<li>${x}</li>`).join(''):'<li>Sigue practicando para desarrollar estas habilidades.</li>'}</ul>
    </div>
    <div class="rcard rc-imp">
      <div class="rc-t">⚡ A seguir trabajando</div>
      <ul>${improve.length?improve.map(x=>`<li>${x}</li>`).join(''):'<li>¡Excelente! No hay áreas críticas que mejorar esta sesión.</li>'}</ul>
    </div>
  </div>

  <div class="rcard rc-nxt">
    <div class="rc-t">🚀 Recomendaciones para la Guía 3</div>
    <ul>
      <li>${nextDiff}</li>
      ${s.voc<4?'<li>Practica leyendo artículos cortos de ciencia o naturaleza y deduciendo palabras nuevas por el contexto antes de buscarlas.</li>':''}
      ${s.inf<2?'<li>Al leer un texto informativo, busca conectores como "por lo tanto", "debido a" o "sin embargo": suelen marcar relaciones de causa-efecto.</li>':''}
      ${s.correctCount<5?'<li>Para diferenciar ideas principales de secundarias, pregúntate: ¿esta frase resume algo importante, o es solo un dato que lo explica?</li>':''}
      <li>Próxima guía: <strong>Texto Biográfico/Histórico</strong> → línea de tiempo, interpretación de personajes reales, argumentación.</li>
    </ul>
  </div>

  <div style="text-align:center;margin-top:22px;">
    <button class="btn btn-s" onclick="restart()">🔁 Reiniciar guía</button>
  </div>
</div>`;}

function animateRing(){
  requestAnimationFrame(()=>{
    const el=document.getElementById('ringFill');
    if(!el)return;
    const off=parseFloat(el.dataset.offset);
    requestAnimationFrame(()=>{ el.style.strokeDashoffset=off; });
  });
}

function restart(){
  phase='activation';
  litI=0;litA=[];infI=0;infA=[];critSelf=null;
  vocI=0;vocA=[];placement={};
  dndChecked=false;dragIdx=null;selIdx=null;
  render();
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
render();
</script>
