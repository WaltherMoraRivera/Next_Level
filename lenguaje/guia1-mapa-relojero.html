*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{

/* ── Header ── */
.g-header{
  background:var(--purple); color:white;
  padding:12px 20px;
  display:flex; align-items:center; gap:14px;
  position:sticky; top:0; z-index:50;
  box-shadow:0 2px 12px rgba(109,40,217,.35);
}
.g-badge{
  background:rgba(255,255,255,.18); border-radius:20px;
  padding:4px 12px; font-size:11px; font-weight:800;
  letter-spacing:1.5px; white-space:nowrap; flex-shrink:0;
}
.g-dots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap;}
.g-dot{
  width:9px;height:9px;border-radius:50%;
  background:rgba(255,255,255,.28);
  transition:all .2s;
}
.g-dot.done{background:rgba(255,255,255,.65);}
.g-dot.active{background:white;transform:scale(1.4);}
.g-pname{font-size:12px;font-weight:700;white-space:nowrap;opacity:.92;flex-shrink:0;}

/* ── Layout ── */
.wrap{max-width:740px;margin:0 auto;padding:28px 18px 80px;}

/* ── Card ── */
.card{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:26px 30px;
  animation:up .3s ease;
}
@keyframes up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.s-label{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--purple);margin-bottom:4px;}
.s-title{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:14px;text-wrap:balance;font-family:Georgia,serif;}
.s-body{font-size:15px;color:var(--ink-mid);line-height:1.72;}
.s-hint{font-size:13px;color:var(--ink-muted);font-style:italic;margin-top:8px;}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:11px 20px;border-radius:8px;
  font-size:14px;font-weight:700;font-family:inherit;
  cursor:pointer;border:none;transition:all .15s;
}
.btn-p{background:var(--purple);color:white;}
.btn-p:hover{background:var(--purple-dk);transform:translateY(-1px);}
.btn-p:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-s{background:var(--purple-light);color:var(--purple);border:1.5px solid var(--border);}
.btn-s:hover{background:var(--border);}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}

/* ── Reveal ── */
.reveal{
  background:var(--purple-light);
  border-left:4px solid var(--purple);
  border-radius:0 var(--radius) var(--radius) 0;
  padding:14px 18px; margin-top:14px;
  display:none; animation:up .3s ease;
  font-size:14px; color:var(--ink-mid); line-height:1.65;
}
.reveal.on{display:block;}
.reveal strong{color:var(--purple);}

/* ── Reading text ── */
.rtext{
  background:var(--purple-xlight);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:22px 26px;
  font-size:15.5px; line-height:1.88;
  color:var(--ink); margin:14px 0;
}
.rtext h3{
  font-family:Georgia,serif; font-size:20px;
  color:var(--purple-dk); margin-bottom:14px;
  text-align:center;
}
.rtext p{margin-bottom:11px;}
.rtext p:last-child{margin-bottom:0;}
.vhl{
  color:var(--purple);font-weight:700;
  border-bottom:2px dotted var(--purple-md);
  cursor:help;
}

/* ── Quiz ── */
.qz-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.qz-bar-wrap{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.qz-bar{height:100%;background:var(--purple);border-radius:3px;transition:width .3s;}
.qz-ctr{font-size:12px;font-weight:700;color:var(--ink-muted);white-space:nowrap;}
.qz-q{font-size:15.5px;font-weight:700;color:var(--ink);margin-bottom:14px;line-height:1.5;text-wrap:balance;}
.qz-opts{display:flex;flex-direction:column;gap:9px;}
.qz-opt{
  background:var(--surface);border:2px solid var(--border);border-radius:10px;
  padding:12px 17px;font-size:14.5px;font-family:inherit;
  color:var(--ink);cursor:pointer;text-align:left;
  transition:all .15s;line-height:1.4;
}
.qz-opt:hover:not(:disabled){border-color:var(--purple-md);background:var(--purple-light);}
.qz-opt.ok{border-color:var(--green);background:var(--green-light);color:var(--green);}
.qz-opt.no{border-color:var(--red);background:var(--red-light);color:var(--red);}
.qz-opt:disabled{cursor:default;}
.qz-fb{
  margin-top:14px;padding:13px 17px;border-radius:10px;
  font-size:13.5px;line-height:1.6;display:none;animation:up .25s ease;
}
.qz-fb.on{display:block;}
.qz-fb.ok-fb{background:var(--green-light);color:var(--green);border:1.5px solid var(--green);}
.qz-fb.no-fb{background:var(--red-light);color:var(--red);border:1.5px solid var(--red);}

/* ── Vocabulary ── */
.vdots{display:flex;gap:5px;margin-bottom:14px;}
.vdot{width:9px;height:9px;border-radius:50%;background:var(--border);transition:background .2s;}
.vdot.cur{background:var(--purple);transform:scale(1.3);}
.vdot.ok{background:var(--green);}
.vdot.no{background:var(--red);}

.vcard{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.vcard-top{background:var(--purple-light);padding:14px 18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.vword{font-size:22px;font-weight:800;color:var(--purple);font-family:Georgia,serif;}
.vctx{font-size:12.5px;color:var(--ink-muted);font-style:italic;}
.vbody{padding:14px 18px;}
.vopts{display:flex;flex-direction:column;gap:7px;margin-top:9px;}
.vopt{
  background:var(--bg);border:1.5px solid var(--border);border-radius:8px;
  padding:9px 15px;font-size:14px;font-family:inherit;
  color:var(--ink);cursor:pointer;text-align:left;transition:all .15s;
}
.vopt:hover:not(:disabled){border-color:var(--purple);background:var(--purple-light);}
.vopt.ok{border-color:var(--green);background:var(--green-light);color:var(--green);}
.vopt.no{border-color:var(--red);background:var(--red-light);color:var(--red);}
.vreveal{display:none;margin-top:12px;animation:up .3s ease;}
.vreveal.on{display:block;}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-top:11px;}
.vtag{background:var(--purple-light);border-radius:8px;padding:8px 11px;}
.vtag .vt-l{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--purple);margin-bottom:2px;}
.vtag .vt-v{font-size:13.5px;color:var(--ink-mid);}
.vex{background:var(--indigo-light);border-radius:8px;padding:9px 13px;font-size:13.5px;color:var(--ink-mid);margin-top:9px;font-style:italic;}
.vex::before{content:'📝 ';font-style:normal;}

/* ── Open question ── */
.oq{font-size:15.5px;font-weight:700;color:var(--ink);margin-bottom:13px;line-height:1.5;}
.otxt{
  width:100%;min-height:120px;
  background:var(--bg);border:1.5px solid var(--border);border-radius:10px;
  padding:13px 15px;font-size:15px;font-family:inherit;color:var(--ink);
  resize:vertical;line-height:1.6;transition:border-color .15s;
}
.otxt:focus{outline:none;border-color:var(--purple);}
.omodel{display:none;margin-top:14px;animation:up .3s ease;}
.omodel.on{display:block;}
.omodel-box{
  background:var(--purple-light);border-left:4px solid var(--purple);
  border-radius:0 var(--radius) var(--radius) 0;
  padding:15px 19px;font-size:14px;color:var(--ink-mid);line-height:1.65;
}
.omodel-box strong{color:var(--purple);display:block;margin-bottom:5px;font-size:12px;letter-spacing:.5px;}
.seval{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px;}
.seval-l{font-size:13px;font-weight:700;color:var(--ink-muted);}
.sbtn{
  padding:7px 15px;border-radius:20px;border:2px solid;
  font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s;
}
.sbtn.yes{border-color:var(--green);color:var(--green);background:var(--green-light);}
.sbtn.part{border-color:var(--amber);color:var(--amber);background:var(--amber-light);}
.sbtn.no2{border-color:var(--red);color:var(--red);background:var(--red-light);}
.sbtn.sel{filter:brightness(.88);}

/* ── Drag & Drop ── */
.dnd-tip{
  background:var(--amber-light);border:1px solid var(--amber);
  border-radius:9px;padding:10px 14px;
  font-size:13.5px;color:var(--ink-mid);margin-bottom:14px;
}
.dnd-slots{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
.dslot{
  display:flex;align-items:center;gap:11px;
  min-height:52px;border:2px dashed var(--border);
  border-radius:10px;padding:7px 13px;
  transition:all .15s;background:var(--bg);cursor:pointer;
}
.dslot:hover{border-color:var(--purple-md);}
.dslot.over{border-color:var(--purple);background:var(--purple-light);}
.dslot.ok{border-color:var(--green);background:var(--green-light);border-style:solid;}
.dslot.no{border-color:var(--red);background:var(--red-light);border-style:solid;}
.dslot.sel-target{border-color:var(--purple);border-style:solid;background:var(--purple-light);}
.snum{
  width:27px;height:27px;border-radius:50%;
  background:var(--purple-light);color:var(--purple);
  font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.scont{font-size:13.5px;color:var(--ink-mid);flex:1;line-height:1.4;}
.sempty{font-size:13px;color:var(--border);font-style:italic;}
.sicon{font-size:15px;flex-shrink:0;}
.remove-btn{
  background:none;border:none;color:var(--ink-muted);
  cursor:pointer;font-size:16px;margin-left:auto;
  padding:2px 6px;border-radius:4px;flex-shrink:0;
}
.remove-btn:hover{color:var(--red);background:var(--red-light);}
.dbank-lbl{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-muted);margin-bottom:7px;}
.dbank{display:flex;flex-direction:column;gap:7px;}
.ditem{
  background:var(--surface);border:2px solid var(--purple-md);
  border-radius:10px;padding:10px 15px;
  font-size:13.5px;color:var(--ink);cursor:grab;line-height:1.4;
  transition:all .15s;user-select:none;
  display:flex;align-items:center;gap:9px;
}
.ditem::before{content:'⠿';color:var(--purple-md);font-size:16px;flex-shrink:0;}
.ditem:hover{background:var(--purple-light);transform:translateY(-1px);box-shadow:0 3px 10px rgba(109,40,217,.14);}
.ditem.dragging{opacity:.35;}
.ditem.placed{display:none;}
.ditem.sel-item{background:var(--purple-light);border-color:var(--purple);box-shadow:0 0 0 3px rgba(109,40,217,.2);}

/* ── Report ── */
.ring-wrap{width:116px;height:116px;margin:0 auto 18px;position:relative;}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--border);stroke-width:10;}
.ring-fill{fill:none;stroke:var(--purple);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .9s ease;}
.ring-num{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:26px;font-weight:900;color:var(--purple);line-height:1;
}
.ring-num span{font-size:11px;font-weight:600;color:var(--ink-muted);}
.rep-msg{text-align:center;font-size:17px;font-weight:700;margin-bottom:18px;color:var(--ink);line-height:1.45;text-wrap:balance;}
.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;}
.rcard{border-radius:var(--radius);padding:13px 15px;border:1.5px solid var(--border);}
.rcard .rc-t{font-size:10.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px;}
.rcard ul{list-style:none;}
.rcard ul li{font-size:13.5px;color:var(--ink-mid);padding:3px 0;display:flex;gap:6px;align-items:baseline;}
.rcard ul li::before{content:'·';font-size:18px;flex-shrink:0;line-height:1;}
.rc-ok{background:var(--green-light);}
.rc-ok .rc-t,.rc-ok li::before{color:var(--green);}
.rc-imp{background:var(--amber-light);}
.rc-imp .rc-t,.rc-imp li::before{color:var(--amber);}
.rc-nxt{background:var(--purple-light);margin-top:11px;}
.rc-nxt .rc-t,.rc-nxt li::before{color:var(--purple);}
.rlevel{
  text-align:center;margin:14px 0;
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px;
}
.rlevel .rl-l{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--ink-muted);}
.rlevel .rl-v{font-size:16px;font-weight:700;color:var(--ink);margin-top:4px;}

/* ── Section divider badges ── */
.score-row{
  display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;
}
.score-pill{
  background:var(--purple-light);border-radius:20px;
  padding:5px 13px;font-size:13px;color:var(--purple);font-weight:600;
}

/* ── Responsive ── */
@media(max-width:580px){
  .card{padding:18px 16px;}
  .rtext{padding:17px 14px;}
  .g-header{padding:10px 14px;}
  .g-pname{display:none;}
  .vword{font-size:19px;}
}
</style>

function calcScore(){
  const lit = litA.filter((a,i)=>a===LIT[i].c).length;
  const inf = infA.filter((a,i)=>a===INF[i].c).length;
  const crit = critSelf==='yes'?2:critSelf==='part'?1:0;
  const voc = vocA.filter((a,i)=>a===VOCAB[i].c).length;
  const allDnd = slots.every((s,i)=>s===i);
  const partDnd = slots.filter((s,i)=>s===i).length>=3;
  const dnd = allDnd?4:partDnd?2:0;
  const total = lit*2+inf*2+crit+voc+dnd;
  return {lit,inf,crit,voc,dnd,total,max:24};
}

function rQuiz(qs,ans,cur,label,title,ansF,nxtF,doneF){
  const q=qs[cur];
  const done=ans[cur]!==undefined;
  const isOk=done&&ans[cur]===q.c;
  return`
<div class="card">
  <div class="s-label">${label}</div>
  <div class="s-title">${title}</div>
  <div class="qz-head">
    <span class="qz-ctr">Pregunta ${cur+1} de ${qs.length}</span>
    <div class="qz-bar-wrap"><div class="qz-bar" style="width:${Math.round(cur/qs.length*100)}%"></div></div>
  </div>
  <p class="qz-q">${q.q}</p>
  <div class="qz-opts">
    ${q.opts.map((o,i)=>{
      let cls='';
      if(done){if(i===q.c)cls='ok';else if(i===ans[cur])cls='no';}
      return`<button class="qz-opt ${cls}" ${done?'disabled':''} onclick="${ansF}(${i})">${o}</button>`;
    }).join('')}
  </div>
  <div class="qz-fb ${done?'on':''} ${isOk?'ok-fb':'no-fb'}" id="qfb">
    ${done?(isOk?q.fb_ok:q.fb_no):''}
  </div>
  <div class="btn-row">
    ${done?(cur<qs.length-1
      ?`<button class="btn btn-p" onclick="${nxtF}()">Siguiente pregunta →</button>`
      :`<button class="btn btn-p" onclick="${doneF}()">Continuar →</button>`):''}
  </div>
</div>`;}

    }).join('')}

  <p class="dbank-lbl">Banco de eventos →</p>
  <div class="dbank" id="dBank">
    ${DND_ORDER.map(evIdx=>{
      const placed=slots.includes(evIdx);
      const isSel=selIdx===evIdx;
      return`
      <div class="ditem ${placed?'placed':''} ${isSel?'sel-item':''}" id="di-${evIdx}"
        draggable="true"
        ondragstart="dStart(event,${evIdx})" ondragend="dEnd(event)"
        onclick="itemClick(${evIdx})">
        ${DND_CORRECT[evIdx]}
      </div>`;
    }).join('')}
  </div>

  ${dndChecked?`
  <div class="qz-fb on ${slots.every((s,i)=>s===i)?'ok-fb':'no-fb'}" style="margin-top:16px;">
    ${slots.every((s,i)=>s===i)
      ?'✅ ¡Perfecto! Ordenaste los 5 eventos correctamente. Excelente comprensión de la secuencia temporal del texto.'
      :`⚡ Algunos eventos estaban en el orden incorrecto. La secuencia correcta era:<br>
        1→ ${DND_CORRECT[0]}<br>
        2→ ${DND_CORRECT[1]}<br>
        3→ ${DND_CORRECT[2]}<br>
        4→ ${DND_CORRECT[3]}<br>
        5→ ${DND_CORRECT[4]}`}
  </div>`:''}

  <div class="btn-row" style="margin-top:18px;">
    ${!dndChecked
      ?`<button class="btn btn-p" onclick="checkDnd()" ${slots.includes(null)?'disabled':''}>Verificar orden ✓</button>`
      :`<button class="btn btn-p" onclick="go('challenge')">Continuar →</button>`}
  </div>
</div>`;}

function dStart(e,idx){
  dragIdx=idx; selIdx=null;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>{const el=document.getElementById('di-'+idx);if(el)el.classList.add('dragging');},0);
}
function dEnd(){
  if(dragIdx!==null){const el=document.getElementById('di-'+dragIdx);if(el)el.classList.remove('dragging');}
  dragIdx=null;
  document.querySelectorAll('.dslot').forEach(s=>s.classList.remove('over'));
}
function dOver(e,i){e.preventDefault();document.getElementById('sl-'+i).classList.add('over');}
function dLeave(e,i){document.getElementById('sl-'+i).classList.remove('over');}
function dDrop(e,i){
  e.preventDefault();
  document.getElementById('sl-'+i).classList.remove('over');
  if(dragIdx===null)return;
  const existing=slots[i];
  const prevSlot=slots.indexOf(dragIdx);
  if(prevSlot!==-1)slots[prevSlot]=existing;
  slots[i]=dragIdx;
  dragIdx=null;
  render();
}
function itemClick(evIdx){
  if(dndChecked)return;
  selIdx=selIdx===evIdx?null:evIdx;
  render();
}
function slotClick(i){
  if(dndChecked||selIdx===null)return;
  const existing=slots[i];
  const prev=slots.indexOf(selIdx);
  if(prev!==-1)slots[prev]=existing;
  slots[i]=selIdx;
  selIdx=null;
  render();
}
function rmSlot(e,i){e.stopPropagation();slots[i]=null;render();}
function checkDnd(){dndChecked=true;render();}

function rReport(){
  const s=calcScore();
  const p=Math.round(s.total/s.max*100);
  const C=2*Math.PI*45;
  const off=C-(p/100)*C;

  let emoji,msg,level,nextDiff;
  if(p>=85){
    emoji='🏆';msg='¡Excelente trabajo! Demostraste una comprensión sólida del texto en todos los niveles evaluados.';
    level='Avanzado';nextDiff='La siguiente guía aumentará la longitud del texto y la complejidad de las inferencias.';
  } else if(p>=67){
    emoji='⭐';msg='¡Muy buen desempeño! Comprendes bien el texto, con algunas áreas que siguen desarrollándose.';
    level='Intermedio alto';nextDiff='Se mantendrá la dificultad actual con variaciones en el vocabulario y el género textual.';
  } else if(p>=50){
    emoji='📈';msg='Buen intento. Tienes bases sólidas, pero hay habilidades que vale la pena seguir practicando.';
    level='Intermedio';nextDiff='La siguiente guía reforzará las inferencias con más pistas y conectores en el texto.';
  } else {
    emoji='💪';msg='Sigue adelante. Cada guía te ayudará a mejorar. ¡Los errores son parte del aprendizaje!';
    level='En desarrollo';nextDiff='La siguiente guía tendrá un texto más corto con preguntas guiadas adicionales.';
  }

  const strengths=[], improve=[];
  if(s.lit>=2)strengths.push('Comprensión literal'); else improve.push('Comprensión literal (buscar datos exactos en el texto)');
  if(s.inf>=2)strengths.push('Comprensión inferencial'); else improve.push('Comprensión inferencial (deducir información implícita)');
  if(s.voc>=4)strengths.push('Vocabulario en contexto'); else improve.push('Vocabulario (deducir significado por el contexto)');
  if(slots.every((v,i)=>v===i))strengths.push('Secuencia temporal de eventos'); else improve.push('Organización y secuencia de eventos');
  if(critSelf==='yes')strengths.push('Argumentación con evidencia textual'); else improve.push('Argumentación y uso de evidencia del texto');

  return`
<div class="card">
  <div class="s-label">📊 Informe Final</div>
  <div class="s-title">Guía 1 · El mapa del relojero</div>

  <div class="ring-wrap">
    <svg viewBox="0 0 100 100">
      <circle class="ring-bg" cx="50" cy="50" r="45"/>
      <circle class="ring-fill" cx="50" cy="50" r="45"
        stroke-dasharray="${C}" stroke-dashoffset="${C}" id="ringFill"
        data-offset="${off}"/>
    </svg>
    <div class="ring-num">${p}%<span>${s.total}/${s.max} pts</span></div>
  </div>

  <p class="rep-msg">${emoji} ${msg}</p>

  <div class="score-row">
    <span class="score-pill">Literal: ${s.lit}/3 ×2 = ${s.lit*2}pts</span>
    <span class="score-pill">Inferencial: ${s.inf}/3 ×2 = ${s.inf*2}pts</span>
    <span class="score-pill">Vocabulario: ${s.voc}/6 = ${s.voc}pts</span>
    <span class="score-pill">Organización: ${s.dnd}/4 pts</span>
    <span class="score-pill">Crítica: ${s.crit}/2 pts</span>
  </div>

  <div class="rlevel"><div class="rl-l">Nivel estimado</div><div class="rl-v">${level}</div></div>

  <div class="rep-grid">
    <div class="rcard rc-ok">
      <div class="rc-t">✅ Habilidades fortalecidas</div>
      <ul>${strengths.length?strengths.map(x=>`<li>${x}</li>`).join(''):'<li>Sigue practicando para desarrollar estas habilidades.</li>'}</ul>
    </div>
    <div class="rcard rc-imp">
      <div class="rc-t">⚡ A seguir trabajando</div>
      <ul>${improve.length?improve.map(x=>`<li>${x}</li>`).join(''):'<li>¡Excelente! No hay áreas críticas que mejorar esta sesión.</li>'}</ul>
    </div>
  </div>

  <div class="rcard rc-nxt">
    <div class="rc-t">🚀 Recomendaciones para la Guía 2</div>
    <ul>
      <li>${nextDiff}</li>
      ${s.voc<4?'<li>Practica leyendo cualquier texto y deduciendo el significado de las palabras nuevas antes de buscarlas.</li>':''}
      ${s.inf<2?'<li>Al leer, pregúntate siempre: ¿qué información el autor no dice directamente pero puedo deducir de las pistas?</li>':''}
      ${!slots.every((v,i)=>v===i)?'<li>Para mejorar la secuencia temporal, anota mientras lees los eventos con un número de orden.</li>':''}
      <li>Próxima guía: <strong>Texto Científico/Informativo</strong> → ideas principales vs. secundarias, causa-efecto.</li>
    </ul>
  </div>

  <div style="text-align:center;margin-top:22px;">
    <button class="btn btn-s" onclick="restart()">🔁 Reiniciar guía</button>
  </div>
</div>`;}

function animateRing(){
  requestAnimationFrame(()=>{
    const el=document.getElementById('ringFill');
    if(!el)return;
    const off=parseFloat(el.dataset.offset);
    requestAnimationFrame(()=>{ el.style.strokeDashoffset=off; });
  });
}

function restart(){
  phase='activation';
  litI=0;litA=[];infI=0;infA=[];critSelf=null;
  vocI=0;vocA=[];slots=[null,null,null,null,null];
  dndChecked=false;dragIdx=null;selIdx=null;
  render();
}
